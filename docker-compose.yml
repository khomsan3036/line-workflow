# ทางเลือกสำหรับผู้ที่ไม่อยากติดตั้ง PostgreSQL ลงเครื่อง
#   docker compose up -d      # เปิดฐานข้อมูล
#   docker compose down       # ปิด (ข้อมูลยังอยู่ใน volume)
#   docker compose down -v    # ปิดและลบข้อมูลทั้งหมด
services:
  postgres:
    image: postgres:16-alpine
    container_name: linechat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: linechat
      TZ: Asia/Bangkok
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d linechat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
