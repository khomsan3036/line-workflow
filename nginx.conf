# Map for proper Connection header handling per request:
#    - WebSocket handshake (Upgrade: websocket) -> "Connection: upgrade"
#    - Everything else (no Upgrade header)      -> "Connection: close"
# Without this, sending a hard-coded `Connection: upgrade` on negotiate /
# long-poll / SSE requests can break those transports.
# Variable hash sizing. Every `set $name ...` in this file (one per proxied
# service, ~30 of them) lands in nginx's variables hash, and the 1024 default
# max_size stopped being enough when the HRMS Web Mobile and approval-engine
# blocks were added — nginx then logs "could not build optimal variables_hash"
# on every start and reload and falls back to a suboptimal layout. It still
# serves, but a gateway that warns on every reload trains people to ignore its
# output. Raise this rather than removing the warning's cause; adding a service
# should not be a tuning exercise.
# (http-context directives: the contents of this file are included into http{}.)
variables_hash_max_size 2048;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# This stack's Next.js container. Reached by a name UNIQUE to it, never the
# generic compose service name: the stack runs on the shared external network
# `engflow_default`, where several stacks had a service called `web` (the
# saroop web app among them). Docker's DNS answers such a name with EVERY
# matching container, and nginx puts ALL addresses of a static upstream into
# one round-robin pool — so half of every weld-app request was answered by the
# saroop container, which is built with basePath /saroop and 404s anything
# else. That is what made `/`, `/_next/image?url=...` and friends fail on
# alternating requests (a browser sees it as random 404s on images and pages).
# `weld-log-app-web` is this container's container_name and an explicit network
# alias (docker-compose.yml) — keep both unique to this stack.
# NOTE: a static upstream is resolved once at config load, so nginx must be
# restarted/reloaded for a change here (or an upstream IP change) to take.
upstream weld_log_app {
    server weld-log-app-web:3000;
    keepalive 32;
}

# QC SignalR backend (matches WELD_QC_API_URL in .env.production). Reached by
# its LAN address — same host as the Integra auth backend (192.168.2.13:7005);
# its old public name qtecdatabase.ddns.net is retired. An unresolvable name
# in a static upstream would stop nginx from starting, so keep this an IP.
upstream qc_hub_backend {
    server 192.168.2.13:5750;
    keepalive 32;
}


# Maintenance web app (Next.js standalone, container port 5110 — see
# maintenance-web-app/compose.yaml). The nginx container must share a
# user-defined Docker network with it:
#   docker network connect <nginx-network> maintenance-web-app
# Deliberately NOT a static `upstream` block: nginx resolves upstream hosts at
# config load and refuses to start/reload with "host not found in upstream"
# if the container is down. The variable + resolver pattern below defers DNS
# to request time (a down app then 502s only its own routes).
#
# INSPECTOR STACK — same variable + resolver pattern. The inspector web app
# joins the shared infra network (`engflow_default`, see
# inspector-web-app/compose.yaml). nginx and the inspector API containers must
# be on a common network with it; connect any that aren't, e.g.:
#   docker network connect engflow_default <container>

map $uri $api_backend {
    # Unmapped /api/* paths (weld app API routes, /api/auth, /api/fastcare)
    # fall through to the weld app — the pre-gateway behavior. Values carry
    # their own port because the two targets listen on different ones.
    #
    # NOTE: these bare resource names belong to the MAINTENANCE services. The
    # inspector services use /api/<service>/ prefixes (own location blocks
    # below) precisely so they can't collide with this map.
    default                                                        weld_log_app;

    ~^/api/(assets|asset-classes|attachments|locations)(/|$)       maintenance-asset-service:8080;
    ~^/api/audit-logs(/|$)                                         maintenance-auditlog-service:8080;
    ~^/api/files(/|$)                                              maintenance-filestorage-service:8080;
    ~^/api/fuel-requests(/|$)                                      maintenance-fuel-service:8080;
    ~^/api/(notifications|email-templates)(/|$)                    maintenance-notification-service:8080;
    ~^/api/repair-requests(/|$)                                    maintenance-repair-service:8080;
    ~^/api/suppliers(/|$)                                          maintenance-supplier-service:8080;
    ~^/api/(vehicles|vehicle-bookings)(/|$)                        maintenance-vehicle-service:8080;
    ~^/api/(approvals|approval-processes)(/|$)                     maintenance-workflow-service:8080;
    ~^/api/(projects|activities|areas|categories|employees)(/|$)   maintenance-project-service:8080;
}

# [1] SERVER BLOCK: สั่งให้ HTTP (Port 80) วิ่งไปหา HTTPS (Port 443) อัตโนมัติ
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# [2] SERVER BLOCK: ระบบหลักที่เปิดใช้งาน HTTPS (Port 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # Docker's embedded DNS (only available on user-defined networks). Lets
    # variable proxy_pass targets resolve at request time instead of at load.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $maintenance_web_app maintenance-web-app:5110;
    set $inspector_web_app   inspector-web-app:5220;
    set $fastcare_web_app    fastcare-web-app:5101;
    set $hr_web_app          hr-web-app:3000;
    set $hr_auth_service     hr_auth_service:8080; 
    set $hr_dashboard_service     hr_dashboard_service:8080;
    set $integra_web_app     integra-web-app:3000;
    set $saroop_web_app      saroop-web-app:3000;
    
    # ---- การตั้งค่าไฟล์ SSL Certificate ----
    # ปรับปรุง Path ใหม่ให้ดึงไฟล์จากโฟลเดอร์ที่แชร์แอปพลิเคชันร่วมกันด้านใน Docker
    #
    # IMPORTANT: this file must be the FULL CHAIN (leaf + Sectigo intermediates),
    # not the leaf alone. Strict clients — the LINE Messaging API webhook
    # verifier among them — do not fetch missing intermediates like browsers do
    # and fail the handshake with "An SSL connection error occurred". A ready
    # fullchain (leaf + "Sectigo Public Server Authentication CA DV R36" +
    # cross-signed R46 root) is kept next to this config as
    # qtecintegra_com_fullchain.pem; overwrite the mounted pem with it when the
    # certificate is renewed, too.
    # ssl_certificate /usr/share/nginx/html/qtecintegra_com_cert.pem;
    ssl_certificate /usr/share/nginx/html/qtecintegra_com_fullchain.pem;
    ssl_certificate_key /usr/share/nginx/html/qtecintegra.com.key;

    # มาตรฐานความปลอดภัย SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Reasonable defaults
    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # The default mime.types bundled with nginx does not map .mjs (ES module).
    types {
        application/javascript   js mjs;
        application/json          json;
        application/json          map;
        application/wasm          wasm;
        text/css                  css;
        text/html                 html htm;
        image/svg+xml             svg svgz;
        image/png                 png;
        image/jpeg                jpg jpeg;
        image/gif                 gif;
        image/webp                webp;
        image/x-icon              ico;
        font/woff                 woff;
        font/woff2                woff2;
        font/ttf                  ttf;
        font/otf                  otf;
        application/pdf           pdf;
        text/plain                txt;
    }
    default_type application/octet-stream;

    # ---- Static assets served straight off the mounted volume ----
    # Both Next.js apps share the /_next/static prefix. Chunks found in the
    # weld volume are served from disk; anything else falls through to the
    # maintenance app (content-hashed filenames make collisions impossible).
    # (The inspector app is built with basePath /inspector, so its chunks live
    # under /inspector/_next/... and never enter this location.)
    location /_next/static/ {
        alias /usr/share/nginx/html/_next/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @maintenance;
    }

    # ---- SignalR hub: proxied DIRECTLY to the QC backend ----
    location ^~ /qc-hub {
        rewrite ^/qc-hub(/.*)?$ /hubs/qc-backlog$1 break;

        proxy_pass http://qc_hub_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;

        # Required for SignalR (WebSockets / SSE / long-poll)
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        proxy_redirect          off;

        # Long-lived transports
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ---- Inspector MCP server (Streamable HTTP) ----
    # The inspector web app's AI assistant is configured with
    # MCP_SERVER_URL=https://qtecintegra.com/qc/mcp; the rewrite maps that to
    # the container's /mcp endpoint. Streamable HTTP mixes POSTs with long-
    # lived SSE responses, so buffering is off and timeouts are generous.
    # NOTE: the MCP server has no authentication of its own — this location
    # makes its read-only tools (projects, inspections) reachable from the
    # internet. Restrict here (allow/deny, auth_basic) if that ever changes.
    location ^~ /qc/mcp {
        set $inspector_mcp inspector-api-mcp:8080;
        rewrite ^/qc/mcp(/.*)?$ /mcp$1 break;

        proxy_pass http://$inspector_mcp;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ---- Maintenance MCP server (Streamable HTTP) ----
    # maintenance-mcp-service (maintenance-web-api/maintenance-mcp-service) is the
    # AI gateway over the maintenance fuel / repair / vehicle services. Public URL
    # https://qtecintegra.com/maintenance/mcp; the rewrite maps that to the
    # container's /mcp endpoint (legacy SSE clients use /maintenance/mcp/sse).
    # Same variable + resolver pattern as /qc/mcp above; the container joins the
    # shared infra network via compose.prod.yaml. Health: /health/mcp (matched by
    # the ^/health/([a-z]+)$ block below → maintenance-mcp-service:8080/health).
    # NOTE: the MCP server has no authentication of its own — its notification
    # tools publish to RabbitMQ / LINE. Restrict here (allow/deny, auth_basic)
    # before exposing it beyond trusted AI clients.
    location ^~ /maintenance/mcp {
        set $maintenance_mcp maintenance-mcp-service:8080;
        rewrite ^/maintenance/mcp(/.*)?$ /mcp$1 break;

        proxy_pass http://$maintenance_mcp;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        # The service maps this onto its PathBase, so the legacy SSE transport advertises
        # /maintenance/mcp/message (not /mcp/message) as its POST endpoint.
        proxy_set_header X-Forwarded-Prefix /maintenance;

        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;

        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ---- Inspector daily-report web app ----
    # The app is BUILT with basePath /inspector (derived from
    # NEXT_PUBLIC_BASE_PATH=https://qtecintegra.com/inspector), so it serves
    # everything under this prefix itself: pages, /inspector/_next/* build
    # assets, public files, and its own /inspector/api/ai-chat route. One
    # prefix block is therefore all the routing it needs.
    #
    # LINE notification deep links land here too: the daily API builds
    # {LineMessaging__ReportBaseUrl}/check-status/{id} — i.e.
    # /inspector/check-status/{id} — which opens the submitted report's
    # detail dialog (bouncing through /inspector/login first when the
    # visitor has no session).
    location ^~ /inspector {
        proxy_pass http://$inspector_web_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- FastCare todo web app ----
    # Built with basePath /fastcare (from NEXT_PUBLIC_BASE_PATH=
    # https://qtecintegra.com/fastcare, see Ticket/nextjs/.env.production), so
    # like the inspector app it serves everything under this prefix itself:
    # pages, /fastcare/_next/* build assets, and public/ files. The container
    # (fastcare-web-app, Ticket/nextjs/compose.yaml) joins engflow_default;
    # its API calls go to the /api/fastcare/* locations below.
    location ^~ /fastcare {
        proxy_pass http://$fastcare_web_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- HR Manpower Dashboard (Next.js standalone, basePath /hr) ----
    # Built with NEXT_PUBLIC_BASE_PATH=/hr (see hr-web-app/docker-compose.yml
    # build args), so like the inspector/fastcare apps it serves everything
    # under this prefix itself: pages, /hr/_next/* build assets, public/ files,
    # and its own /hr/api/manpower route — no separate /api block needed.
    # The container (hr-web-app) listens on port 3000 and joins the shared
    # engflow_default network (see hr-web-app/docker-compose.yml), the same one
    # nginx and the inspector/fastcare apps are on — so it resolves by name with
    # no manual `docker network connect`.
    # `set` + resolver defers DNS to request time, so a down HR app 502s only
    # its own routes instead of blocking nginx startup.
    location ^~ /hr {
        proxy_pass http://$hr_web_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- QTEC Integra platform web app (Next.js standalone, basePath /integra) ----
    # Built with NEXT_PUBLIC_BASE_PATH=/integra (compose build arg), so like the
    # inspector/fastcare/hr apps it serves everything under this prefix itself:
    # pages, /integra/_next/* build assets, public files, and its own API routes
    # (the /integra/api/project-executions proxy, /integra/api/auth/line, the
    # AI chat). The container (compose service integra-web-app, port 3000, see
    # integra-web-app/docker-compose.yml) joins engflow_default; its server-side
    # EDMS/project-execution calls hairpin back through the /api/edms/<service>/
    # and /api/project-execution/ locations below. Body cap matches the app's
    # 210 MB server-action limit for drawing-attachment streaming — the
    # server-wide 50m default would cut uploads off at the edge.
    location ^~ /integra {
        proxy_pass http://$integra_web_app;
        proxy_http_version 1.1;
        client_max_body_size 210m;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- Saroop meeting-summary web app (Next.js standalone, basePath /saroop) ----
    # Built with NEXT_PUBLIC_BASE_PATH=https://qtecintegra.com/saroop (see
    # saroop-web-app/.env.production), so like the inspector/fastcare/hr/integra
    # apps it serves everything under this prefix itself: pages,
    # /saroop/_next/* build assets, public files — and, critically, its own
    # /saroop/api/auth/line route (the LINE code exchange, which holds the
    # channel secret). The basePath is what keeps that route out of the
    # /api/auth/ alias below, which belongs to the Integra auth backend.
    # Sign-in itself goes to the shared auth service via /api/auth/ and
    # /api/emp/auth, and meeting data to /api/saroop/ — both same-origin, so
    # no CORS is involved anywhere.
    # The containers come from saroop-web-app/deploy/ run with the
    # compose.gateway.yaml overlay, which drops the bundled front-door nginx
    # and joins them to engflow_default under the names used here.
    location ^~ /saroop {
        proxy_pass http://$saroop_web_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- Maintenance web app pages ----
    # /services/* is the whole maintenance feature surface; asset QR labels
    # encode {NEXT_PUBLIC_BASE_API_URL}/services/{assetCode}, so this prefix
    # must reach the maintenance app on this host.
    location ^~ /services {
        proxy_pass http://$maintenance_web_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # Maintenance app sign-in. NOTE: this claims /login for the maintenance
    # app; if the weld app has its own /login page, one of the two must move
    # (e.g. rebuild one app with a basePath) — they cannot share the path.
    # (The inspector app's login lives at /inspector/login via its basePath,
    # so it is unaffected.)
    location = /login {
        proxy_pass http://$maintenance_web_app;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- Maintenance app public/ assets ----
    # The maintenance app references /media/* (app logos, avatars, brand
    # icons) and the two qtec-*.png logos below. Disk-first like /_next/static:
    # a file present in the weld volume is served from disk, anything missing
    # proxies through to the maintenance app's own public/ folder.
    location ^~ /media/ {
        root /usr/share/nginx/html/public;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri @maintenance;
    }

    location ~ ^/(qtecLogo|qtec-1)\.png$ {
        root /usr/share/nginx/html/public;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri @maintenance;
    }

    # public/ files (favicon, images, robots.txt, etc.)
    location / {
        root /usr/share/nginx/html/public;
        try_files $uri @nextjs;
    }

    # ---- All dynamic Next.js traffic (SSR, /api/*, rewrites) ----
    location @nextjs {
        proxy_pass http://weld_log_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # Fallback target for maintenance-app static chunks (see /_next/static/).
    location @maintenance {
        proxy_pass http://$maintenance_web_app;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- Auth backend (shared QTEC auth service on the host, port 7005) ----
    # Both the maintenance and inspector apps set
    # NEXT_PUBLIC_AUTH_API_URL=https://qtecintegra.com/api/auth and call
    # {base}/api/v1/..., so requests arrive as /api/auth/api/v1/auth/login.
    # The trailing "/" on proxy_pass strips the matched /api/auth/ prefix: the
    # backend sees /api/v1/auth/login. (The weld app reaches the same backend
    # via its own /auth-api/* rewrite.)
    location /api/auth/ {
        proxy_pass http://192.168.2.13:7005/;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- HR API service (containerized HR_AUTH_SERVICE) --------------------
    # Formerly the Integra CheckEmpCode host backend at 192.168.2.13:5107; now
    # a .NET container (compose service hr_auth_service, listens on 8080) that
    # joins the shared engflow_default network, so nginx resolves it by name
    # via the $hr_auth_service variable set above — no host-IP hairpin. It
    # serves employee-lookup AND the manpower dashboard endpoints:
    #     /api/v1/CheckEmpCode/GetEmpInfoByCode?code=<empCode>
    #     /api/v1/CheckEmpName/GetEmpInfoByName?name=<name>
    #     /api/v1/Manpower/GetManpowerByDate|GetManpowerByDateTime?...
    #     /api/v1/Manpower/PushDailySummary   (POST)
    # `set` + resolver defers DNS to request time, so a down HR container 502s
    # only its own routes instead of blocking nginx startup.
    #
    # Gateway: give the frontend base URL https://qtecintegra.com/api/hr and
    # append the service's own /api/v1/... route, so requests arrive as
    # /api/hr/api/v1/Manpower/GetManpowerByDate?... — the rewrite strips the
    # /api/hr prefix and the container sees its native /api/v1/... route.
    # proxy_pass carries no URI part because with a variable target nginx would
    # otherwise discard the rewritten URI.
    #
    # The HR dashboard's own server-side proxy (hr-web-app /api/manpower route)
    # also targets this block: MANPOWER_API_BASE=https://qtecintegra.com/api/hr
    # (see hr-web-app/.env.production), and it appends /API/V1/Manpower/... — so
    # that call hairpins in here too and lands on hr_auth_service:8080.
    location /api/hr/ {
        rewrite ^/api/hr(/.*)$ $1 break;
        proxy_pass http://$hr_auth_service;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- HR dashboard service (attendance read models) ---------------------
    # Longest-prefix match puts /api/hr/dashboard/* here rather than in the
    # /api/hr/ block above, so this is the ONLY way to reach
    # $hr_dashboard_service — the container behind the Integra HRMS live
    # panels (AttByDept, AbsentToday, KpiCards, AttRateToday/Trend,
    # ManpowerByDept, LeaveTodayByType, AttHeatmapDept7Days, EmpMasterData).
    #
    # The rewrite must strip the WHOLE gateway prefix, like every other
    # prefixed block in this file. It stripped only /api/hr before, which left
    # the container seeing /dashboard/api/v1/... — a route it does not serve,
    # so every request through this block 404'd (empty-body Kestrel 404,
    # verified against the live gateway on 3 Aug 2026).
    #
    # Consumer: integra-web-app's server-side proxies, built with
    # NEXT_PUBLIC_HR_API_BASE_URL=https://qtecintegra.com/api/hr/dashboard
    # (.env.production); they append the service's native /api/v1/... route, so
    # requests arrive as /api/hr/dashboard/api/v1/EmpMasterData/... and hairpin
    # back in here.
    location /api/hr/dashboard/ {
        rewrite ^/api/hr/dashboard(/.*)$ $1 break;
        proxy_pass http://$hr_dashboard_service;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- Legacy employee-code lookup alias --------------------------------
    # Existing frontends still call the short alias
    #     https://qtecintegra.com/api/emp/auth?code=<empCode>
    # `location =` matches the exact path (the query string is never part of
    # location matching, so no trailing slash here — a trailing slash would
    # miss this URL entirely and drop it into the generic /api/ gateway, which
    # is why it 404'd). The rewrite swaps in the backend route; nginx carries
    # the ?code=... query string over automatically. Now repointed at the
    # container ($hr_auth_service) instead of the retired host backend.
    location = /api/emp/auth {
        rewrite ^ /api/v1/CheckEmpCode/GetEmpInfoByCode break;
        proxy_pass http://$hr_auth_service;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # Pass-through for any OTHER route on the same backend:
    # /api/emp/auth/<path> -> http://$hr_auth_service/<path>
    # (e.g. /api/emp/auth/api/v1/CheckEmpCode/GetEmpInfoByCode?code=... also
    # works, matching the /api/auth/ prefix-strip convention above).
    location /api/emp/auth/ {
        rewrite ^/api/emp/auth(/.*)$ $1 break;
        proxy_pass http://$hr_auth_service;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- Inspector API services -------------------------------------------
    # The inspector frontend env gives each service a path-prefixed base URL
    # (NEXT_PUBLIC_DAILY_API_URL=https://qtecintegra.com/api/daily, ...) and
    # its client appends the service's own /api/... route, so requests arrive
    # as e.g. /api/daily/api/daily-inspections. The rewrite strips the
    # /api/<service> prefix; the container then sees its native route
    # (/api/daily-inspections). `set` + resolver defers DNS to request time —
    # same reasoning as $maintenance_web_app above. proxy_pass carries no URI
    # part because with a variable target nginx would otherwise discard the
    # rewritten URI.
    #
    # ---- Legacy LINE-notification report links --------------------------
    # LINE messages sent BEFORE the deep-link change carried
    #     https://qtecintegra.com/api/daily/api/daily-inspections/{id}
    # — the daily API's raw JSON resource. New messages link to the web app
    # (LineMessaging__ReportBaseUrl=https://qtecintegra.com/inspector →
    # /inspector/check-status/{id}), but old messages in chat history keep
    # their old URL, so send a CLICK on one to the report's page instead.
    # Only top-level browser navigations redirect (Sec-Fetch-Mode: navigate);
    # the inspector web app's own fetch() calls to this same path send
    # "cors"/"same-origin" (or no header, e.g. curl) and still proxy through
    # to the API below, so nothing programmatic breaks. This regex location
    # is evaluated before the /api/daily/ prefix match, and every other
    # /api/daily/* route is untouched.
    # (Quoted: the {36} brace quantifier would otherwise be read as a config
    # block delimiter by the nginx parser.)
    #
    # A second legacy shape exists from the transition window: a daily API
    # running the NEW link code but still configured with the OLD base URL
    # (LINE_REPORT_BASE_URL=https://qtecintegra.com/api/daily) produced
    #     /api/daily/check-status/{id}
    #     /api/daily/check-status/{id}/photo-report
    # — paths neither the API nor the app serves (404). The daily API has no
    # /check-status routes at all, so the whole subtree is redirected to the
    # web app verbatim (id, /photo-report, and any future sub-page alike).
    location ~ "^/api/daily/(?<report_page>check-status/.*)$" {
        return 302 /inspector/$report_page;
    }

    location ~ "^/api/daily/api/daily-inspections/(?<report_id>[0-9a-fA-F\-]{36})$" {
        if ($http_sec_fetch_mode = "navigate") {
            return 302 /inspector/check-status/$report_id;
        }

        set $inspector_daily inspector-api-daily:8080;
        rewrite ^/api/daily(/.*)$ $1 break;
        proxy_pass http://$inspector_daily;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # daily: daily inspections, status workflow, dashboard summary.
    location /api/daily/ {
        set $inspector_daily inspector-api-daily:8080;
        rewrite ^/api/daily(/.*)$ $1 break;
        proxy_pass http://$inspector_daily;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # project: projects, employees, categories, areas, activities. Distinct
    # from the maintenance map's bare /api/projects — longest-prefix match
    # sends /api/project/... here and /api/projects to the map.
    location /api/project/ {
        set $inspector_project inspector-api-project:8080;
        rewrite ^/api/project(/.*)$ $1 break;
        proxy_pass http://$inspector_project;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # filestorage: photo/document upload + download. Bigger body cap for
    # multi-photo report uploads.
    location /api/filestorage/ {
        set $inspector_filestorage inspector-api-filestorage:8080;
        rewrite ^/api/filestorage(/.*)$ $1 break;
        proxy_pass http://$inspector_filestorage;
        proxy_http_version 1.1;
        client_max_body_size 100m;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # audit: read-only audit-log queries (distinct from the maintenance map's
    # bare /api/audit-logs).
    location /api/audit/ {
        set $inspector_audit inspector-api-auditlog:8080;
        rewrite ^/api/audit(/.*)$ $1 break;
        proxy_pass http://$inspector_audit;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- LINE Messaging webhook (inspector daily API) ----------------------
    # LINE Developers console → Messaging API → Webhook URL:
    #     https://qtecintegra.com/api/line/webhook
    # Exact-match so it wins over the generic /api/ gateway below, whose map
    # would otherwise default this path to the weld app (404). No rewrite:
    # /api/line/webhook is already the container's native route. Authenticity
    # is enforced by the backend itself (X-Line-Signature, HMAC with the
    # channel secret) — nginx only narrows the surface.
    location = /api/line/webhook {
        set $inspector_daily_line inspector-api-daily:8080;

        # LINE only ever POSTs (the console's Verify button included);
        # refuse every other method at the edge.
        limit_except POST { deny all; }

        # Webhook payloads are small JSON event batches — don't inherit the
        # server-wide 50m body cap.
        client_max_body_size 64k;

        proxy_pass http://$inspector_daily_line;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # LINE gives webhook deliveries only a few seconds before it counts
        # them as failed (and eventually flags the endpoint unhealthy) — a
        # wedged upstream must not hold the connection for the server-wide
        # 300s defaults.
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
        proxy_send_timeout    10s;
    }

    # ---- LINE Workflow App (HR Notification OA) webhook -----------------------
    # The line-workflow-app container (Node/Express, ../line-workflow-app) runs
    # the "HR Notification" LINE Official Account: group chat recorder, rich
    # menu auto-replies, attendance summaries. Its webhook route is the bare
    # /webhook, so the gateway prefix is mapped onto it here (proxy_pass with an
    # explicit URI replaces the request path). LINE Developers Console >
    # Messaging API > Webhook URL must be set to:
    #     https://qtecintegra.com/api/line-workflow/webhook
    # Only the webhook is exposed through the gateway on purpose: the app's
    # admin dashboard has no base-path support (absolute /login redirects,
    # /images/... assets), so it is reached on the LAN at port 3000 instead.
    # Authenticity is enforced by the app (X-Line-Signature, HMAC with
    # CHANNEL_SECRET); nginx only narrows the surface. The container must join
    # engflow_default (docker-compose.prod.yml does) so the name resolves.
    location = /api/line-workflow/webhook {
        set $line_workflow_app line-workflow-app:3000;

        limit_except POST { deny all; }
        client_max_body_size 64k;

        proxy_pass http://$line_workflow_app/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Same budget as /api/line/webhook: the app answers 200 immediately and
        # processes events afterwards, so anything slower is a wedged upstream.
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
        proxy_send_timeout    10s;
    }

    # ---- LINE Workflow App (Maintenance Team OA) webhook -----------------------
    # Second Official Account served by the same line-workflow-app container:
    # the "MT Notification" chatbot (OpenAI/Claude + maintenance MCP tools) and the
    # RabbitMQ -> LINE group alert bridge. It has its own channel secret
    # (CHANNEL_SECRET_MT), verified by the app at /webhook/mt (the app also
    # routes by signature, so an event that lands on the HR path still works).
    # LINE Developers Console > Messaging API > Webhook URL must be set to:
    #     https://qtecintegra.com/api/line-workflow/webhook/mt
    location = /api/line-workflow/webhook/mt {
        set $line_workflow_app line-workflow-app:3000;

        limit_except POST { deny all; }
        client_max_body_size 64k;

        proxy_pass http://$line_workflow_app/webhook/mt;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Same budget as /api/line-workflow/webhook: the app answers 200 at once
        # and processes the events afterwards.
        proxy_connect_timeout 5s;
        proxy_read_timeout    10s;
        proxy_send_timeout    10s;
    }

    # ---- LINE Workflow App admin dashboard --------------------------------
    # Same container as the webhook above. The app is started with
    # BASE_PATH=/line-workflow (docker-compose.prod.yml / .env), so it expects
    # the prefix on every request and emits it on every link and redirect —
    # no rewrite here, the full path is passed through. Its session cookie is
    # scoped to Path=/line-workflow under its own name, so it does not collide
    # with the other apps on this host. ^~ keeps /line-workflow/login out of
    # the exact-match `location = /login` (Integra) below and ahead of the
    # `location /` weld-app fallback.
    location = /line-workflow {
        return 301 /line-workflow/;
    }
    location ^~ /line-workflow/ {
        set $line_workflow_app line-workflow-app:3000;

        proxy_pass http://$line_workflow_app;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Media downloads from the gallery can be large-ish; AI summaries can
        # take a while. Inherit the server-wide 50m / 300s defaults.
    }

    # ---- FastCare API services ----------------------------------------------
    # Namespaced under /api/fastcare/<service>/ because the bare prefixes are
    # taken: /api/auth is the Integra backend, /api/audit and /api/filestorage
    # belong to the inspector stack. The frontend env (Ticket/nextjs/
    # .env.production) gives each service a path-prefixed base URL and its
    # client appends the service's own native route, so requests arrive as
    # e.g. /api/fastcare/todo/api/tasks — the rewrite strips the gateway
    # prefix and the container sees /api/tasks. The fastcare-service-*
    # containers (Ticket/backendapi/docker-compose.yml) already join
    # engflow_default, so they resolve by container name here. Longest-prefix
    # match keeps these ahead of the generic /api/ gateway below.
    #
    # auth: the LEGACY Auth.Api that issues the JWTs the todo services trust
    # (the app's sign-in bridge logs into it alongside Integra) — not to be
    # confused with the Integra /api/auth location above.
    location /api/fastcare/auth/ {
        set $fastcare_auth fastcare-service-auth:8080;
        rewrite ^/api/fastcare/auth(/.*)$ $1 break;
        proxy_pass http://$fastcare_auth;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # todo: tasks (kanban board + list views), lists, tags.
    location /api/fastcare/todo/ {
        set $fastcare_todo fastcare-service-todo:8080;
        rewrite ^/api/fastcare/todo(/.*)$ $1 break;
        proxy_pass http://$fastcare_todo;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # audit: audit-log queries (distinct from the inspector's /api/audit).
    location /api/fastcare/audit/ {
        set $fastcare_audit fastcare-service-auditlog:8080;
        rewrite ^/api/fastcare/audit(/.*)$ $1 break;
        proxy_pass http://$fastcare_audit;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # notification: notification feed + email templates.
    location /api/fastcare/notification/ {
        set $fastcare_notification fastcare-service-notification:8080;
        rewrite ^/api/fastcare/notification(/.*)$ $1 break;
        proxy_pass http://$fastcare_notification;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # files: task-attachment upload/download. Body cap matches the app's
    # 50MB MAX_UPLOAD_BYTES and the API's [RequestSizeLimit].
    location /api/fastcare/files/ {
        set $fastcare_files fastcare-service-filestorage:8080;
        rewrite ^/api/fastcare/files(/.*)$ $1 break;
        proxy_pass http://$fastcare_files;
        proxy_http_version 1.1;
        client_max_body_size 50m;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- INTEGRA document services (backend/integra-api repo) ---------------
    # The flat /api/<name>-service/ prefixes named by .env.production:
    #     NEXT_PUBLIC_DRAWING_API_BASE_URL=https://qtecintegra.com/api/drawing-service
    #     NEXT_PUBLIC_FILESTORAGE_API_BASE_URL=.../api/filestorage-service   (etc.)
    # Same convention as every other prefixed block here: the caller appends the
    # service's native route, so a request arrives as
    # /api/drawing-service/api/drawings and the rewrite strips the gateway
    # prefix, leaving the container its own /api/drawings. proxy_pass carries no
    # URI part because with a variable target nginx would discard the rewritten
    # URI. `set` + resolver defers DNS to request time, so a down service 502s
    # only its own routes instead of blocking nginx startup.
    #
    # These are the integra-* containers from backend/integra-api/compose.yaml
    # (all port 8080, all on the external engflow_default network via its
    # `infra` alias). They REPLACE the former /api/edms/<service>/ family, which
    # routed the same seven services to the edms-* containers built from the
    # integra-system/integra-web-api repo. Those blocks are gone from this file;
    # two references to them survive elsewhere and are now stale — the /integra
    # app comment near the top, and the /health/edms-<svc> probe at the bottom,
    # which still resolves edms-*-service names no location serves any more.
    #
    # Prefix collisions were checked; none of these are reachable by an earlier
    # block, because nginx prefix matching is literal:
    #   /api/filestorage-service/  vs the inspector's /api/filestorage/  — the
    #     character after "/api/filestorage" is "-", not "/", so no match.
    #   /api/auditlog-service/     vs the inspector's /api/audit/        — likewise.
    #   /api/notification-service/ vs the maintenance map's /api/notifications.
    # Longest-prefix match also keeps all seven ahead of the generic /api/
    # gateway at the bottom of this file, which would otherwise send them to the
    # weld app and 404.

    # auditlog: read-only audit-log queries (api/auditlogs).
    location /api/auditlog-service/ {
        set $integra_auditlog integra-auditlog-service:8080;
        rewrite ^/api/auditlog-service(/.*)$ $1 break;
        proxy_pass http://$integra_auditlog;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # drawing: drawing register (api/drawings), document categories and the
    # area/unit/system/work-package breakdown trees, revision children.
    location /api/drawing-service/ {
        set $integra_drawing integra-drawing-service:8080;
        rewrite ^/api/drawing-service(/.*)$ $1 break;
        proxy_pass http://$integra_drawing;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # filestorage: drawing file upload/download (api/files). Body cap matches
    # the API's 200 MB [RequestSizeLimit] / MultipartBodyLengthLimit — the
    # server-wide 50m default would cut drawing attachments off at the edge.
    location /api/filestorage-service/ {
        set $integra_filestorage integra-filestorage-service:8080;
        rewrite ^/api/filestorage-service(/.*)$ $1 break;
        proxy_pass http://$integra_filestorage;
        proxy_http_version 1.1;
        client_max_body_size 200m;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # logging: read-only application-log queries (api/logs) — the write path is
    # RabbitMQ, not HTTP.
    location /api/logging-service/ {
        set $integra_logging integra-logging-service:8080;
        rewrite ^/api/logging-service(/.*)$ $1 break;
        proxy_pass http://$integra_logging;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # notification: notification feed (api/notifications).
    location /api/notification-service/ {
        set $integra_notification integra-notification-service:8080;
        rewrite ^/api/notification-service(/.*)$ $1 break;
        proxy_pass http://$integra_notification;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # progress: spool/weld progress tracking (api/progress).
    location /api/progress-service/ {
        set $integra_progress integra-progress-service:8080;
        rewrite ^/api/progress-service(/.*)$ $1 break;
        proxy_pass http://$integra_progress;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # transmittal: transmittals, transmittal lookups, document approvals.
    location /api/transmittal-service/ {
        set $integra_transmittal integra-transmittal-service:8080;
        rewrite ^/api/transmittal-service(/.*)$ $1 break;
        proxy_pass http://$integra_transmittal;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- Integra Project Management Workspace API (integra-api repo) --------
    # The PMW backend (backend/integra-api/integra-project-service): project
    # register + the seven Transaction forms, summary/analytics, work packages,
    # department budgets. Own prefix because every bare name is taken —
    # /api/projects belongs to the MAINTENANCE map, /api/project/ to the
    # INSPECTOR. No clash with either: "/api/project/" is not a prefix of
    # "/api/project-service/...". The frontend is built with
    #     NEXT_PUBLIC_PROJECT_API_BASE_URL=https://qtecintegra.com/api/project-service
    # and its client (lib/api/project-api.ts) appends the service's native
    # routes (api/projects, api/work-packages, api/department-budgets), so
    # requests arrive as /api/project-service/api/projects — the rewrite
    # strips the gateway prefix. The container (compose service
    # integra-project-service, port 8080, backend/integra-api/compose.yaml)
    # joins engflow_default, so it resolves by that name — NOT the bare
    # "project-service", which is no container's alias.
    location /api/project-service/ {
        set $integra_project_api integra-project-service:8080;
        rewrite ^/api/project-service(/.*)$ $1 break;
        proxy_pass http://$integra_project_api;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # form: the controlled-form register (api/forms) behind the Form Register
    # screen and, through lib/server/form-register.ts, every printed sheet's
    # letterhead, revision, paper and signatories. Same prefix-strip convention
    # as the other integra-* services. Reached SERVER-SIDE by the web app
    # (INTEGRA_FORM_API_URL), so this block exists for direct access and for a
    # deployment where the app is off the engflow_default network.
    location /api/form-service/ {
        set $integra_form integra-form-service:8080;
        rewrite ^/api/form-service(/.*)$ $1 break;
        proxy_pass http://$integra_form;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # calibration: the Calibration Management backend
    # (backend/integra-api/integra-calibration-service) — device register,
    # calibration results, out-of-tolerance / withdrawal control. Unlike the
    # document services this one is called from the BROWSER: the frontend is
    # built with
    #     NEXT_PUBLIC_CALIBRATION_API_BASE_URL=https://qtecintegra.com/api/calibration-service
    # and its client (lib/api/calibration-api.ts) appends the service's native
    # routes, so requests arrive as /api/calibration-service/api/v1/devices —
    # the rewrite strips the gateway prefix, same convention as the seven above.
    # Through this location the call is same-origin, so the service's CORS
    # policy never comes into it.
    #
    # No prefix collision: nothing else in this file begins /api/cal…, and
    # longest-prefix match keeps it ahead of the generic /api/ gateway at the
    # bottom, which would otherwise send it to the weld app and 404.
    #
    # Device photographs, certificates and manuals do NOT come through here —
    # they are file_object rows uploaded through the web app's own
    # /api/device-files routes, which reach integra-filestorage-service
    # server-side. That is why no body cap is raised on this block.
    location /api/calibration-service/ {
        set $integra_calibration integra-calibration-service:8080;
        rewrite ^/api/calibration-service(/.*)$ $1 break;
        proxy_pass http://$integra_calibration;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # costcode: the Cost Code Management backend
    # (backend/integra-api/integra-costcode-service) — the master register every
    # cost transaction keys against, plus its approval ladder, revision control,
    # archive gate and CSV import. Called from the BROWSER, like calibration
    # above and unlike the document services: the frontend is built with
    #     NEXT_PUBLIC_COSTCODE_API_BASE_URL=https://qtecintegra.com/api/costcode-service
    # and its client (lib/api/costcode-api.ts) appends the service's native
    # routes, so requests arrive as /api/costcode-service/api/v1/cost-codes —
    # the rewrite strips the gateway prefix, same convention as the others.
    # Through this location the call is same-origin, so the service's CORS
    # policy never comes into it.
    #
    # No prefix collision: nothing else in this file begins /api/cost…, and
    # longest-prefix match keeps it ahead of the generic /api/ gateway at the
    # bottom, which would otherwise send it to the weld app and 404.
    #
    # A CSV import posts one JSON body carrying every parsed row, so this block
    # raises the body cap: the server-wide 50m is ample for a register import
    # (tens of thousands of rows are a few MB), but the default 1m in some
    # deployments is not, and the failure reads as a silent 413 mid-wizard.
    location /api/costcode-service/ {
        set $integra_costcode integra-costcode-service:8080;
        rewrite ^/api/costcode-service(/.*)$ $1 break;
        client_max_body_size 20m;
        proxy_pass http://$integra_costcode;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # winspeed: the WINSpeed ERP read-through backend
    # (backend/integra-api/integra-winspeed-service) — goods codes, units,
    # account codes and PO summaries pulled straight out of the third-party
    # WINSpeed database (dbwins_SRV on 192.168.1.180) through the
    # SP_INTEGRA_GOODCODE stored procedure. READ-ONLY: every controller exposes
    # a single GET, so no body cap is raised on this block.
    #
    # Called from the BROWSER, like calibration and costcode above: give the
    # frontend
    #     NEXT_PUBLIC_WINSPEED_API_BASE_URL=https://qtecintegra.com/api/winspeed-service
    # and let its client append the service's native routes, so requests arrive
    # as /api/winspeed-service/api/v1/GoodCode?keyword=... — the rewrite strips
    # the gateway prefix, same convention as the others. Through this location
    # the call is same-origin, so the service's CORS policy never comes into it.
    #
    # No prefix collision: nothing else in this file begins /api/win…, and
    # longest-prefix match keeps it ahead of the generic /api/ gateway at the
    # bottom, which would otherwise send it to the weld app and 404.
    #
    # The SP runs against a remote ERP box and the service allows it a 3600s
    # command timeout (DatabaseConfig:TimeoutTime), so a cold PO summary can
    # outlast the server-wide 300s proxy timeouts — raised here to 600s rather
    # than the full hour, which is long enough for the real queries while still
    # letting a wedged upstream go.
    location /api/winspeed-service/ {
        set $integra_winspeed integra-winspeed-service:8080;
        rewrite ^/api/winspeed-service(/.*)$ $1 break;
        proxy_pass http://$integra_winspeed;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # logistics: the Logistics Workspace backend
    # (backend/integra-api/integra-logistics-service) — delivery notes and their
    # movement ladder, the transportation plans they ride on, lifting plans and
    # the heavy-lift dispatch gate, and site receiving with its discrepancy
    # arithmetic.
    #
    # Called from the BROWSER, like calibration, costcode and winspeed above and
    # unlike the document services: the frontend is built with
    #     NEXT_PUBLIC_LOGISTICS_API_BASE_URL=https://qtecintegra.com/api/logistics-service
    # and its client (lib/api/logistics-api.ts) appends the service's native
    # routes, so requests arrive as /api/logistics-service/api/v1/logistics/… —
    # the rewrite strips the gateway prefix, same convention as the others.
    # Through this location the call is same-origin, so the service's CORS
    # policy never comes into it.
    #
    # ⚠️ Prefix near-miss, not a collision: /api/logging-service/ sits a few
    # blocks above. They diverge at the fourth character (logG / logI), so
    # neither contains the other and longest-prefix match keeps them apart — but
    # the two names are one keystroke apart, so check which block you are in
    # before editing. Longest-prefix match also keeps this ahead of the generic
    # /api/ gateway at the bottom, which would otherwise send it to the weld app
    # and 404.
    #
    # No body cap is raised here, deliberately. Packing lists, permits, crane
    # load charts and signed delivery notes are NOT posted through this block —
    # they are file_object rows uploaded through the web app's own
    # /api/logistics-files routes, which reach integra-filestorage-service
    # server-side. Same reasoning as the calibration block above.
    #
    # The container publishes host port 5314 (backend/integra-api/compose.yaml).
    # That is irrelevant here — the gateway reaches it on the container's own
    # 8080 like every other service — but it is NOT 5313: that port belongs to
    # integra-winspeed-service, whose block sits directly above this one.
    location /api/logistics-service/ {
        set $integra_logistics integra-logistics-service:8080;
        rewrite ^/api/logistics-service(/.*)$ $1 break;
        proxy_pass http://$integra_logistics;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- HRMS Web Mobile API (integra-api repo) -----------------------------
    # backend/integra-api/integra-hrms-webmobile-service — the ใบลา register the
    # phone writes, plus check-ins, OT requests, time adjustments and web time
    # entries. Publishes leave.* and consumes approval.completed back from the
    # approval engine in the block below; the two are a pair.
    #
    # Called from the BROWSER, like calibration, costcode, winspeed and logistics
    # above and unlike the document services: the frontend is built with
    #     NEXT_PUBLIC_HRMS_WEBMOBILE_API_BASE_URL=https://qtecintegra.com/api/hrms-webmobile-service
    # and its client (lib/api/hrms-webmobile-api.ts) appends the service's native
    # routes (api/v1/leave-requests, api/v1/checkins, api/v1/ot-requests,
    # api/v1/time-adjustments, api/v1/web-time-entries), so requests arrive as
    # /api/hrms-webmobile-service/api/v1/leave-requests — the rewrite strips the
    # gateway prefix, same convention as the others. Through this location the
    # call is same-origin, so the service's CORS policy never comes into it.
    #
    # ⚠️ Prefix near-miss, not a collision: /api/hr/ and /api/hr/dashboard/ sit
    # well above this block. nginx prefix matching is literal and the character
    # after "/api/hr" here is "m", not "/", so neither of those can claim this
    # path — but the names read alike, so check which block you are in before
    # editing. Same class of near-miss the logging/logistics comment flags.
    # Longest-prefix match also keeps this ahead of the generic /api/ gateway at
    # the bottom, which would otherwise send it to the weld app and 404.
    #
    # No body cap is raised, deliberately. Leave attachments are NOT posted
    # through this block — they are file_object rows (ownerType='leave_request')
    # uploaded through the web app's own routes, which reach
    # integra-filestorage-service server-side. Same reasoning as the calibration
    # and logistics blocks above; the client here sends JSON only.
    #
    # The container publishes host port 5315 (backend/integra-api/compose.yaml).
    # That is irrelevant here — the gateway reaches it on the container's own
    # 8080 like every other service.
    location /api/hrms-webmobile-service/ {
        set $integra_hrms_webmobile integra-hrms-webmobile-service:8080;
        rewrite ^/api/hrms-webmobile-service(/.*)$ $1 break;
        proxy_pass http://$integra_hrms_webmobile;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- HRMS Employee API (integra-api repo) -------------------------------
    # backend/integra-api/integra-hrms-employee-service — the employee master
    # register (api/v1/EmployeeData) the HR apps read. Separate service from the
    # ใบลา register in the block above; the two are not a pair and share no
    # database.
    #
    # ⚠️ Prefix near-miss, same class as the block above: /api/hrms-webmobile-
    # service and /api/hrms-employee-service diverge only after "/api/hrms-".
    # nginx prefix matching is literal so neither can claim the other's path, but
    # the names read alike — check which block you are in before editing. The
    # /api/hr/ and /api/hr/dashboard/ blocks sit well above and cannot claim
    # either ("e"/"w" follows /api/hr, not "/"). Longest-prefix match keeps this
    # ahead of the generic /api/ gateway at the bottom, which would otherwise
    # send it to the weld app and 404.
    #
    # Called from the BROWSER, like the HRMS block above: the rewrite strips the
    # gateway prefix, so /api/hrms-employee-service/api/v1/EmployeeData arrives
    # at the service as /api/v1/EmployeeData. Through this location the call is
    # same-origin, so the service's AllowAnyOrigin CORS policy never comes into
    # it. There is NO frontend client yet (nothing in qtec-integra/lib/api) —
    # when one is added, build it with
    #     NEXT_PUBLIC_HRMS_EMPLOYEE_API_BASE_URL=https://qtecintegra.com/api/hrms-employee-service
    # and have it append the service's native api/v1/… routes, same convention.
    #
    # JSON only, so no body cap is raised — employee photographs and documents
    # are not posted through here.
    #
    # The container publishes host port 5317 (backend/integra-api/compose.yaml).
    # That is irrelevant here — the gateway reaches it on the container's own
    # 8080 like every other service.
    location /api/hrms-employee-service/ {
        set $integra_hrms_employee integra-hrms-employee-service:8080;
        rewrite ^/api/hrms-employee-service(/.*)$ $1 break;
        proxy_pass http://$integra_hrms_employee;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- Approval engine API (integra-api repo) -----------------------------
    # backend/integra-api/integra-workflowapproval-service — the generic approval
    # engine: configurable routes and their steps, standing delegations, and the
    # instances documents are actually going through. Consumes leave.submitted /
    # leave.cancelled and publishes approval.*; `approval.completed` is what
    # decides the document on its owning service (the HRMS block above).
    #
    # ⚠️ THE PREFIX AND THE CONTAINER DO NOT SHARE A NAME — the only block in
    # this file where they differ. The gateway prefix is /api/workflow-service;
    # the container is integra-workflowAPPROVAL-service. The prefix is fixed by
    #     NEXT_PUBLIC_WORKFLOWAPPROVAL_API_BASE_URL=https://qtecintegra.com/api/workflow-service
    # (.env.production), which is INLINED INTO THE CLIENT BUNDLES at build time,
    # so renaming it here alone would break every browser already serving the
    # built app. Align the two only by changing that value AND rebuilding the web
    # app — never by editing this location on its own.
    #
    # Called from the BROWSER: lib/api/workflowapproval-api.ts appends the
    # service's native routes (api/v1/approval-flows, api/v1/approval-delegates,
    # api/v1/approvals), so requests arrive as
    # /api/workflow-service/api/v1/approvals/inbox — the rewrite strips the
    # gateway prefix. Same-origin through here, so CORS never comes into it.
    #
    # No collision with the MAINTENANCE workflow service: that one is reached by
    # the bare /api/approvals and /api/approval-processes names in the
    # $api_backend map at the top of this file, which is consulted ONLY by the
    # generic /api/ location — and longest-prefix match keeps this block ahead of
    # it. Nothing else in this file begins /api/workflow.
    #
    # JSON only — approval attachments ride the owning document's service — so no
    # body cap is raised. The container publishes host port 5316
    # (backend/integra-api/compose.yaml).
    location /api/workflow-service/ {
        set $integra_workflowapproval integra-workflowapproval-service:8080;
        rewrite ^/api/workflow-service(/.*)$ $1 break;
        proxy_pass http://$integra_workflowapproval;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- Saroop meeting-service API ----------------------------------------
    # The web app is built with NEXT_PUBLIC_API_BASE_URL=
    # https://qtecintegra.com/api/saroop and its client appends the service's
    # native /api/... routes, so requests arrive as /api/saroop/api/meetings —
    # the rewrite strips the gateway prefix, same convention as the inspector
    # and fastcare services. The container (saroop-meeting-service, port 8080,
    # from saroop-web-app/deploy/compose.yaml + compose.gateway.yaml) joins
    # engflow_default. Meeting recordings run to 500 MB (the API's
    # RequestSizeLimit), far past the server-wide 50m cap, and are streamed
    # rather than spooled so the app's upload progress bar reflects reality.
    # ---- Saroop live-recording SignalR hub ---------------------------------
    # The record page keeps a WebSocket open at /api/saroop/hubs/live for the
    # length of a meeting, streaming mic audio up and transcript results back.
    # Longest-prefix match puts hub traffic here instead of the general
    # /api/saroop/ block below, so the websocket requirements (upgrade
    # headers, no buffering, hour-scale idle timeouts — same treatment as
    # /qc-hub above) don't apply to ordinary API calls.
    location /api/saroop/hubs/ {
        set $saroop_hub saroop-meeting-service:8080;
        rewrite ^/api/saroop(/.*)$ $1 break;
        proxy_pass http://$saroop_hub;
        proxy_http_version 1.1;

        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Required for SignalR (WebSockets / SSE / long-poll)
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_cache             off;
        proxy_redirect          off;

        # Idle timeout between frames, not total lifetime — audio chunks flow
        # every 250 ms, so 1h only guards a genuinely dead peer.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /api/saroop/ {
        set $saroop_api saroop-meeting-service:8080;
        rewrite ^/api/saroop(/.*)$ $1 break;
        proxy_pass http://$saroop_api;
        proxy_http_version 1.1;
        client_max_body_size 500m;
        proxy_request_buffering off;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # ---- API gateway: routes /api/<resource> to the owning container ----
    # Maintenance paths go to their service (see the $api_backend map above);
    # everything else proxies to the weld app like any other dynamic route.
    location /api/ {
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # Per-service health checks: /health/asset, /health/repair, /health/fuel, ...
    location ~ ^/health/(?<svc>[a-z]+)$ {
        proxy_pass http://maintenance-$svc-service:8080/health;
    }

    # PMW backend probe — named after its gateway prefix. Exact match (the
    # hyphen keeps it out of the maintenance ^/health/([a-z]+)$ regex anyway);
    # the service maps /health itself (integra-project-service Program.cs).
    location = /health/project-service {
        set $integra_project_health integra-project-service:8080;
        proxy_pass http://$integra_project_health/health;
    }

    # Calibration backend probe — same convention, named after its gateway
    # prefix; the service maps /health itself (integra-calibration-service
    # Program.cs). Exact match keeps it out of the maintenance
    # ^/health/([a-z]+)$ regex, which the hyphen already excludes.
    location = /health/calibration-service {
        set $integra_calibration_health integra-calibration-service:8080;
        proxy_pass http://$integra_calibration_health/health;
    }

    # Cost code backend probe — same convention, named after its gateway prefix;
    # the service maps /health itself (integra-costcode-service Program.cs).
    # Exact match keeps it out of the maintenance ^/health/([a-z]+)$ regex,
    # which the hyphen already excludes.
    location = /health/costcode-service {
        set $integra_costcode_health integra-costcode-service:8080;
        proxy_pass http://$integra_costcode_health/health;
    }

    # WINSpeed backend probe — same convention, named after its gateway prefix;
    # the service maps /health itself (integra-winspeed-service Program.cs).
    # Exact match keeps it out of the maintenance ^/health/([a-z]+)$ regex,
    # which the hyphen already excludes.
    location = /health/winspeed-service {
        set $integra_winspeed_health integra-winspeed-service:8080;
        proxy_pass http://$integra_winspeed_health/health;
    }

    # Logistics backend probe — same convention, named after its gateway prefix;
    # the service maps /health itself (integra-logistics-service Program.cs).
    # Exact match keeps it out of the maintenance ^/health/([a-z]+)$ regex,
    # which the hyphen already excludes.
    location = /health/logistics-service {
        set $integra_logistics_health integra-logistics-service:8080;
        proxy_pass http://$integra_logistics_health/health;
    }

    # HRMS Web Mobile backend probe — same convention, named after its gateway
    # prefix; the service maps /health itself (integra-hrms-webmobile-service
    # Program.cs line 72). Exact match keeps it out of the maintenance
    # ^/health/([a-z]+)$ regex, which the hyphens already exclude.
    location = /health/hrms-webmobile-service {
        set $integra_hrms_webmobile_health integra-hrms-webmobile-service:8080;
        proxy_pass http://$integra_hrms_webmobile_health/health;
    }

    # HRMS Employee backend probe — same convention, named after its gateway
    # prefix; the service maps /health itself (integra-hrms-employee-service
    # Program.cs line 56, AddHealthChecks + MapHealthChecks). Exact match keeps
    # it out of the maintenance ^/health/([a-z]+)$ regex, which the hyphens
    # already exclude.
    location = /health/hrms-employee-service {
        set $integra_hrms_employee_health integra-hrms-employee-service:8080;
        proxy_pass http://$integra_hrms_employee_health/health;
    }

    # Approval-engine probe — named after the GATEWAY PREFIX (workflow-service),
    # not the container (integra-workflowapproval-service), so it matches the
    # location block above; the service maps /health itself
    # (integra-workflowapproval-service Program.cs line 58).
    location = /health/workflow-service {
        set $integra_workflowapproval_health integra-workflowapproval-service:8080;
        proxy_pass http://$integra_workflowapproval_health/health;
    }

    # Exact match keeps this out of the maintenance ^/health/([a-z]+)$ regex,
    # which would otherwise look for a maintenance-saroop-service.
    location = /health/saroop {
        set $saroop_api_health saroop-meeting-service:8080;
        proxy_pass http://$saroop_api_health/health;
    }
}
